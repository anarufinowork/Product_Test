<!DOCTYPE html>
<html lang="pt">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Produto em Realidade Aumentada</title>


    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>


    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            position: fixed;

            top: 0;
            left: 0;
        }


        a-scene {

            position: fixed !important;

            top: 0 !important;
            left: 0 !important;

            width: 100vw !important;
            height: 100vh !important;

            margin: 0 !important;
            padding: 0 !important;
        }


        #mensagem {

            position: fixed;

            top: 20px;

            left: 0;
            right: 0;

            text-align: center;

            color: white;

            font-family: Arial, sans-serif;

            z-index: 100;

            font-size: 18px;

            text-shadow:
                0 1px 3px black;
        }

    </style>

</head>


<body>


    <div id="mensagem">
        Point your camera at the poster
    </div>


    <a-scene

        mindar-image="
        imageTargetSrc: Poster_Box_Trigger.mind;
        filterMinCF: 0.0001;
        filterBeta: 0.0005;
        "
        embedded
        color-space="sRGB"
        renderer="
            colorManagement: true,
            physicallyCorrectLights
        "
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
    >

        <a-assets>
            <a-asset-item
                id="produto"
                src="Poster_Caixa_Rebativel.glb">
            </a-asset-item>
        </a-assets>
        
        <!-- CÂMARA -->

        <a-camera
            position="0 0 0"
            look-controls="enabled: false">
        </a-camera>


        <!-- TARGET -->

        <a-entity
            mindar-image-target="targetIndex: 0"
            id="target">


            <!-- CUBO DE TESTE -->

            <a-gltf-model
                src="#produto"
                position="-2 -2 0"
                rotation="0 0 0"
                scale="2 2 2">
            </a-gltf-model>


        </a-entity>


    </a-scene>


    <script>

        const target =
            document.querySelector("#target");


        target.addEventListener(
            "targetFound",
            () => {

                console.log(
                    "TARGET ENCONTRADO!"
                );

                document.getElementById(
                    "mensagem"
                ).innerText =
                    "Domplex Foldable Box";

            }
        );


        target.addEventListener(
            "targetLost",
            () => {

                console.log(
                    "TARGET PERDIDO!"
                );

                document.getElementById(
                    "mensagem"
                ).innerText =
                    "Point your camera at the poster";

            }
        );

    </script>


</body>

</html>
